version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # Vendored locally at vendor/xlsx-0.20.3.tgz
      - dependency-name: 'xlsx'
      # Do not upgrade React 18 packages to React 19 (incompatible peerDependencies)
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
    groups:
      react-types:
        patterns:
          - '@types/react*'
      testing:
        patterns:
          - '@testing-library/*'
          - '@vitest/*'
          - 'vitest*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
